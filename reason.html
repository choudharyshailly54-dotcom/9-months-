<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Why I Love You</title>
  <style>
    :root {
      --glass-bg: rgba(255, 255, 255, 0.07);
      --glass-border: rgba(255, 255, 255, 0.18);
      --accent: #ffb3c6;
      --accent-glow: rgba(255, 179, 198, 0.35);
      --text: #ffffff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background-color: #030303; color: var(--text); min-height: 100vh; overflow-x: hidden; }

    #bg-video {
      position: fixed; top: 50%; left: 50%; min-width: 100%; min-height: 100%;
      z-index: -2; transform: translate(-50%, -50%); object-fit: cover; filter: brightness(0.5);
    }
    .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.45); z-index: -1; }

    nav {
      position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 12px; background: var(--glass-bg); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border); padding: 10px 20px; border-radius: 40px; z-index: 100;
    }
    nav a { color: var(--text); text-decoration: none; font-size: 0.9rem; font-weight: 500; padding: 8px 16px; border-radius: 20px; transition: 0.3s; }
    nav a.active, nav a:hover { background: var(--accent); color: #000; box-shadow: 0 0 15px var(--accent-glow); }

    .container { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 100px 20px 60px; max-width: 700px; margin: 0 auto; text-align: center; }
    
    .glass-card {
      background: var(--glass-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border); border-radius: 28px; padding: 45px 35px; width: 100%;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
    }

    .reason-text { font-size: 1.25rem; line-height: 1.8; min-height: 140px; display: flex; align-items: center; justify-content: center; margin: 20px 0; }
    .action-btn { background: var(--accent); color: #000; border: none; padding: 14px 32px; border-radius: 30px; font-weight: 700; cursor: pointer; transition: 0.3s; }
    .action-btn:hover { transform: scale(1.05); box-shadow: 0 0 20px var(--accent-glow); }

    .audio-control {
      position: fixed; bottom: 20px; right: 20px; background: var(--glass-bg); backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border); padding: 10px 18px; border-radius: 30px; display: flex; align-items: center; gap: 10px; z-index: 100;
    }
    .audio-btn { background: var(--accent); border: none; width: 34px; height: 34px; border-radius: 50%; cursor: pointer; font-weight: bold; }
  </style>
</head>
<body>
  <video autoplay loop muted playsinline id="bg-video"><source src="From Klickpin.com- 1128362881683401126-pin-id-1128362881683401126.mp4" type="video/mp4"></video>
  <div class="overlay"></div>

  <audio id="bg-audio" loop><source src="Thoda Thoda Pyaar Stebin Ben _ Kumaar _ Nilesh Ahuja _ Sidharth Malhotra, Neha S _ Lyrics Store 04.mp4" type="audio/mpeg"></audio>
  <div class="audio-control"><span style="font-size:0.85rem">🎵 Sound</span><button class="audio-btn" id="audio-toggle">▶</button></div>

  <nav>
    <a href="index.html">Home</a>
    <a href="timeline.html">9 Months</a>
    <a href="reasons.html" class="active">Reasons</a>
    <a href="letter.html">Letter</a>
  </nav>

  <div class="container">
    <div class="glass-card">
      <h1 style="font-size:2rem; margin-bottom: 10px;">Why I Love You</h1>
      <p style="opacity:0.7; font-size: 0.9rem;">Tap the button to reveal another reason...</p>
      
      <div class="reason-text" id="display">
        "You show me who you are without any hesitation or pretense."
      </div>

      <button class="action-btn" onclick="nextReason()">Tap For Next Reason ✨</button>
    </div>
  </div>

  <script>
    const audio = document.getElementById('bg-audio');
    const audioBtn = document.getElementById('audio-toggle');
    audioBtn.onclick = () => { if (audio.paused) { audio.play(); audioBtn.textContent = '❚❚'; } else { audio.pause(); audioBtn.textContent = '▶'; } };

    const reasons = [
      "1. You show me who you are without any hesitation or pretense.",
      "2. You always ask for my consent and respect my boundaries in every situation.",
      "3. You call me sweet nicknames that never fail to make me smile.",
      "4. You respect me, my personal space, and my thoughts even when we disagree.",
      "5. Truthfully? I can't write a whole book of reasons like other people do, because I love you simply because I love you. I don't know the how, what, or where—I just know that I love you, and I am always going to choose you. 🧿💖"
    ];
    let idx = 0;
    function nextReason() {
      idx = (idx + 1) % reasons.length;
      document.getElementById('display').innerText = reasons[idx];
    }
  </script>
</body>
</html>
